[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-skill-mvp"
version = "0.1.0"
description = "Training-free dynamic skill execution prototype for SkillOpt ALFWorld"
requires-python = ">=3.10"
dependencies = ["omegaconf>=2.3.0"]

[tool.setuptools.packages.find]
include = ["dynamic_skill*", "experiments*"]
exclude = ["results*", "tests*", "skillopt*"]

[tool.setuptools.package-data]
dynamic_skill = ["migration_20261008.json"]
experiments = ["migration_20261008.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
