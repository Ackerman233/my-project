[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-skill-mvp"
version = "0.1.0"
description = "Training-free dynamic skill execution prototype for SkillOpt ALFWorld"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["dynamic_skill*", "experiments*"]
exclude = ["results*", "tests*", "skillopt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
